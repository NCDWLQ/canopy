[package]
name = "canopy"
version = "0.6.0"
description = "Canopy desktop application"
authors = ["Canopy contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.97.1"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "canopy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
eventsource-stream = "0.2.3"
futures-util = "0.3.33"
keyring = { version = "4.1.5", features = ["v1"] }
log = "0.4"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream", "rustls"] }
secrecy = "0.10.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8.6", default-features = false, features = ["sqlite"] }
tauri = { version = "2.11.3", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2.4.0", features = ["sqlite"] }
tauri-plugin-window-state = "2.4.1"
thiserror = "2"
tokio = { version = "1.53.1", features = ["rt", "sync", "time"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
url = "2.5.8"
uuid = { version = "1.18", features = ["v4"] }

[dev-dependencies]
tauri = { version = "2.11.3", features = ["test"] }
tokio = { version = "1.53.1", features = ["test-util"] }
